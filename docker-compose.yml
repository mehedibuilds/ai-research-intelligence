services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  dashboard:
    build: ./apps/dashboard
    ports: ["3000:3000"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pip
      POSTGRES_USER: pip
      POSTGRES_PASSWORD: pip
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data: